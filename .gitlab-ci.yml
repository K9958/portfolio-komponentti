stages:
  - build
  - deploy

build:
  image: node:14
  stage: build
  script:
    - cd FinalAssignment/shop_app
    - npm install
    - npm run build CI=false
  only:
    - main
  artifacts:
    paths:
      - build/
  tags:
    - docker

deploy:
  stage: deploy
  script:
    - cd build/
    - ls -l
    - cp -r ./* $APP_FOLDER